plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'block-scraper-sample-ui'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Dev-only: your shipped jar never contains block-scraper. The "block-scraper" entrypoint is only loaded when block-scraper runs.
	implementation project(':block-scraper-mod')
}

loom {
	mods {
		'block-scraper-sample-ui' {
			sourceSet sourceSets.main
		}
		'block-scraper' {
			sourceSet 'main', ':block-scraper-mod'
		}
	}
}

apply from: rootProject.file('gradle/block-scraper.gradle')

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = mod_java_version as int
	options.encoding = 'UTF-8'
}
