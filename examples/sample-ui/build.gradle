plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'mcshot-sample-ui'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Dev-only: your shipped jar never contains mcshot. The "mcshot" entrypoint is only loaded when mcshot runs.
	implementation project(':mcshot-mod')
}

loom {
	mods {
		'mcshot-sample-ui' {
			sourceSet sourceSets.main
		}
		mcshot {
			sourceSet 'main', ':mcshot-mod'
		}
	}
}

apply from: rootProject.file('gradle/mcshot.gradle')

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = mod_java_version as int
	options.encoding = 'UTF-8'
}
