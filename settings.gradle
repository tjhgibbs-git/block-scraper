pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.fabricmc.fabric-loom' version "${loom_version}"
	}
}

rootProject.name = 'block-scraper'

// Plain-Java modules: no Minecraft needed to build or test these.
include 'block-scraper-core', 'block-scraper-agent'

// The Fabric projects need maven.fabricmc.net and Mojang's servers. Pass
// -Pblock-scraper.coreOnly to skip them (e.g. in sandboxes without that access).
if (!providers.gradleProperty('blockscraper.coreOnly').isPresent()) {
	include 'block-scraper-mod'
	include 'sample-ui'
	project(':sample-ui').projectDir = file('examples/sample-ui')
}
